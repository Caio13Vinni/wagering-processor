services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wager
      POSTGRES_PASSWORD: wager
      POSTGRES_DB: wager
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wager"]
      interval: 2s
      timeout: 3s
      retries: 30

  sqs:
    image: localstack/localstack:3
    environment:
      SERVICES: sqs
    ports:
      - "4566:4566"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 3s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import
    # keycloak não é dependência do app (auth desligada por default, AUTH_ENABLED)

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      sqs:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: wager
      DB_PASSWORD: wager
      DB_NAME: wager
      SQS_ENDPOINT: http://sqs:4566
      PORT: "3000"
    command: sh -c "bun run migration:up && bun run start"
    healthcheck:
      test: ["CMD", "bun", "-e", "const r = await fetch('http://localhost:3000/health/live'); if (!r.ok) process.exit(1)"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 10s

volumes:
  pgdata: